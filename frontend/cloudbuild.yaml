steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --platform=linux/amd64
      - --build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY}
      - --build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      - --build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      - --build-arg=NEXT_PUBLIC_FIREBASE_APP_ID=${_NEXT_PUBLIC_FIREBASE_APP_ID}
      - --build-arg=NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${_NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
      - --build-arg=NEXT_PUBLIC_ECOLOOP_API_ORIGIN=${_NEXT_PUBLIC_ECOLOOP_API_ORIGIN}
      - --build-arg=NEXT_PUBLIC_ECOLOOP_ENABLE_COMMANDS=${_ENABLE_COMMANDS}
      - --build-arg=NEXT_PUBLIC_ECOLOOP_ENABLE_HOUSEHOLD_CREATE=${_ENABLE_HOUSEHOLD_CREATE}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _ENABLE_COMMANDS: "true"
  _ENABLE_HOUSEHOLD_CREATE: "true"
