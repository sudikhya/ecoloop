name: Deploy EcoLoop to Cloud Run (Personal GCP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ecoloop-cloud-run-personal
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_ID: ecoloop-511918
      REGION: asia-south1
      REPOSITORY: ecoloop
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Enable Required Google APIs
        run: |
          gcloud services enable \
            run.googleapis.com \
            artifactregistry.googleapis.com \
            cloudbuild.googleapis.com \
            firestore.googleapis.com \
            aiplatform.googleapis.com \
            --project="${{ env.PROJECT_ID }}" --quiet

      - name: Ensure Artifact Registry exists
        run: |
          if ! gcloud artifacts repositories describe "${{ env.REPOSITORY }}" --project="${{ env.PROJECT_ID }}" --location="${{ env.REGION }}" >/dev/null 2>&1; then
            gcloud artifacts repositories create "${{ env.REPOSITORY }}" \
              --repository-format=docker \
              --location="${{ env.REGION }}" \
              --project="${{ env.PROJECT_ID }}" \
              --description="EcoLoop Docker repository" --quiet
          fi

      - name: Configure Docker Auth
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Build and Deploy API
        run: |
          set -euo pipefail
          tag="${GITHUB_SHA::12}"
          api_image="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${tag}"
          
          docker build --platform linux/amd64 -t "$api_image" backend
          docker push "$api_image"

          gcloud run deploy ecoloop-api \
            --project="${{ env.PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --image="$api_image" \
            --port=8080 \
            --cpu=1 \
            --memory=512Mi \
            --allow-unauthenticated \
            --set-env-vars="FIREBASE_PROJECT_ID=${{ env.PROJECT_ID }},GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }},AGENT_ENABLED=true,AGENT_PROVIDER=vertex,AGENT_MODEL=gemini-3.1-flash-lite,AGENT_THINKING_LEVEL=MINIMAL,PHOTO_MODEL=gemini-3.1-flash-lite,PHOTO_THINKING_LEVEL=MINIMAL,AGENT_VERTEX_PROJECT_ID=${{ env.PROJECT_ID }},AGENT_VERTEX_LOCATION=global" \
            --quiet

          API_URL=$(gcloud run services describe ecoloop-api --project="${{ env.PROJECT_ID }}" --region="${{ env.REGION }}" --format='value(status.url)')
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"

      - name: Build and Deploy Frontend Web
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY || 'AIzaSyAxE8sK9kAaqePPbDCZRlDv9KEGK05Ious' }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_WEB_AUTH_DOMAIN || 'ecoloop-staging-20261015.firebaseapp.com' }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID || '1:26177403871:web:8b3125a80812c8c28be26a' }}
          MAPS_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY || 'AIzaSyCyCLm4ERLVT3HnwYHNGiz14K4E51jkahQ' }}
        run: |
          set -euo pipefail
          tag="${GITHUB_SHA::12}"
          web_image="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${tag}"

          docker build --platform linux/amd64 \
            --build-arg "NEXT_PUBLIC_FIREBASE_API_KEY=${FIREBASE_API_KEY}" \
            --build-arg "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN}" \
            --build-arg "NEXT_PUBLIC_FIREBASE_PROJECT_ID=ecoloop-staging-20261015" \
            --build-arg "NEXT_PUBLIC_FIREBASE_APP_ID=${FIREBASE_APP_ID}" \
            --build-arg "NEXT_PUBLIC_ECOLOOP_API_ORIGIN=${API_URL}" \
            --build-arg "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${MAPS_API_KEY}" \
            --build-arg NEXT_PUBLIC_ECOLOOP_ENABLE_COMMANDS=true \
            --build-arg NEXT_PUBLIC_ECOLOOP_ENABLE_HOUSEHOLD_CREATE=true \
            -t "$web_image" frontend
          docker push "$web_image"

          gcloud run deploy ecoloop-web \
            --project="${{ env.PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --image="$web_image" \
            --port=8080 \
            --cpu=1 \
            --memory=512Mi \
            --allow-unauthenticated \
            --quiet

          WEB_URL=$(gcloud run services describe ecoloop-web --project="${{ env.PROJECT_ID }}" --region="${{ env.REGION }}" --format='value(status.url)')
          echo "--------------------------------------------------------"
          echo "DEPLOYED ECOLOOP WEB APP: $WEB_URL"
          echo "DEPLOYED ECOLOOP API: $API_URL"
          echo "--------------------------------------------------------"
