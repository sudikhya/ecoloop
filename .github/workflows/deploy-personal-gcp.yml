name: Deploy EcoLoop to Cloud Run (Personal GCP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ecoloop-cloud-run-personal
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ecoloop-511918
      PROJECT_NUMBER: "722209767801"
      REGION: asia-south1
      REPOSITORY: ecoloop
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/722209767801/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@ecoloop-511918.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Enable Required Google APIs
        run: |
          gcloud services enable \
            run.googleapis.com \
            artifactregistry.googleapis.com \
            cloudbuild.googleapis.com \
            firestore.googleapis.com \
            maps-backend.googleapis.com \
            places.googleapis.com \
            --project="${{ env.PROJECT_ID }}" --quiet

      - name: Ensure Artifact Registry exists
        run: |
          if ! gcloud artifacts repositories describe "${{ env.REPOSITORY }}" --project="${{ env.PROJECT_ID }}" --location="${{ env.REGION }}" >/dev/null 2>&1; then
            gcloud artifacts repositories create "${{ env.REPOSITORY }}" \
              --repository-format=docker \
              --location="${{ env.REGION }}" \
              --project="${{ env.PROJECT_ID }}" \
              --description="EcoLoop Docker repository" --quiet
          fi

      - name: Configure Docker Auth
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Build and Deploy API
        run: |
          set -euo pipefail
          tag="${GITHUB_SHA::12}"
          api_image="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${tag}"
          
          docker build --platform linux/amd64 -t "$api_image" backend
          docker push "$api_image"

          gcloud run deploy ecoloop-api \
            --project="${{ env.PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --image="$api_image" \
            --port=8080 \
            --cpu=1 \
            --memory=512Mi \
            --min=0 \
            --max=1 \
            --concurrency=20 \
            --timeout=60 \
            --allow-unauthenticated \
            --set-env-vars="FIREBASE_PROJECT_ID=${{ env.PROJECT_ID }},GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }},GOOGLE_CLOUD_PROJECT_NUMBER=${{ env.PROJECT_NUMBER }},AGENT_ENABLED=false,SURPLUS_PILOT_ENABLED=true,SURPLUS_INTAKE_AGENT_RESOURCE=projects/722209767801/locations/asia-south1/reasoningEngines/2932028075371659264,COLLECTION_PLANNER_AGENT_RESOURCE=projects/722209767801/locations/asia-south1/reasoningEngines/5620677052911845376,AGENT_RUNTIME_LOCATION=asia-south1,MAX_SURPLUS_MEDIA_BYTES=5000000,BACKEND_CORS_ORIGINS=[\"https://ecoloop-web-${{ env.PROJECT_NUMBER }}.${{ env.REGION }}.run.app\"]" \
            --quiet

          API_URL=$(gcloud run services describe ecoloop-api --project="${{ env.PROJECT_ID }}" --region="${{ env.REGION }}" --format='value(status.url)')
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"

      - name: Build and Deploy Frontend Web
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_AUTH_DOMAIN: "ecoloop-511918.firebaseapp.com"
          FIREBASE_APP_ID: "1:722209767801:web:0d8d715756c5a69a1cefa8"
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_BROWSER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_MAPS_API_KEY}"
          tag="${GITHUB_SHA::12}"
          web_image="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${tag}"

          docker build --platform linux/amd64 \
            --build-arg "NEXT_PUBLIC_FIREBASE_API_KEY=${FIREBASE_API_KEY}" \
            --build-arg "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN}" \
            --build-arg "NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ env.PROJECT_ID }}" \
            --build-arg "NEXT_PUBLIC_FIREBASE_APP_ID=${FIREBASE_APP_ID}" \
            --build-arg "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}" \
            --build-arg "NEXT_PUBLIC_ECOLOOP_API_ORIGIN=${API_URL}" \
            --build-arg NEXT_PUBLIC_ECOLOOP_ENABLE_COMMANDS=true \
            --build-arg NEXT_PUBLIC_ECOLOOP_ENABLE_HOUSEHOLD_CREATE=true \
            --build-arg NEXT_PUBLIC_ECOLOOP_ENABLE_SURPLUS_PILOT=true \
            -t "$web_image" frontend
          docker push "$web_image"

          gcloud run deploy ecoloop-web \
            --project="${{ env.PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --image="$web_image" \
            --port=8080 \
            --cpu=1 \
            --memory=512Mi \
            --min=0 \
            --max=1 \
            --concurrency=20 \
            --timeout=60 \
            --allow-unauthenticated \
            --quiet

          WEB_URL=$(gcloud run services describe ecoloop-web --project="${{ env.PROJECT_ID }}" --region="${{ env.REGION }}" --format='value(status.url)')
          PUBLIC_WEB_URL="https://ecoloop-web-${{ env.PROJECT_NUMBER }}.${{ env.REGION }}.run.app"

          gcloud run services update ecoloop-api \
            --project="${{ env.PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --update-env-vars="^@^BACKEND_CORS_ORIGINS=[\"${WEB_URL}\",\"${PUBLIC_WEB_URL}\"]" \
            --quiet

          curl --fail --silent --show-error --retry 6 --retry-delay 5 "${API_URL}/api/v1/health" >/dev/null
          curl --fail --silent --show-error --retry 6 --retry-delay 5 "${PUBLIC_WEB_URL}" >/dev/null

          echo "=========================================================="
          echo "ECOLOOP WEB DEPLOYED: $PUBLIC_WEB_URL"
          echo "ECOLOOP API DEPLOYED: $API_URL"
          echo "=========================================================="
